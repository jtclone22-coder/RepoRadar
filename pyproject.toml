[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reporadar"
version = "0.1.0"
description = "Every git repository on your PC, and which ones hold work that exists nowhere else."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
reporadar = "reporadar.cli:main"

[tool.setuptools]
packages = ["reporadar"]
